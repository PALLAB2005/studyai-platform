<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyAI — AI-Powered Student Learning Platform</title>
    <meta name="description" content="StudyAI helps students learn courses, track progress, prepare for exams, test knowledge with AI quizzes, and build job-ready skills." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Theme initialization: default to light, respect explicit user toggle.
      // One-time reset: clear stale dark preference so light is the default.
      (function() {
        var key = 'studyai_theme';
        var resetKey = 'studyai_theme_reset_v2';
        if (!localStorage.getItem(resetKey)) {
          localStorage.setItem(key, 'light');
          localStorage.setItem(resetKey, '1');
        }
        var stored = localStorage.getItem(key);
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="h-full antialiased font-sans bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
